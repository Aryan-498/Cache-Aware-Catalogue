services:
  postgres:
    image: postgres:15
    container_name: catalogue-postgres
    environment:
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue123
      POSTGRES_DB: catalogue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7
    container_name: catalogue-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: